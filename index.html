<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge Closing Check</title>
  <style>
    :root {
      --blue: #0b5fa5;
      --orange: #f28c28;
      --light: #f5f7fa;
      --dark: #1f2933;
      --green: #1f8f4e;
      --border: #d7dee7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--light);
      color: var(--dark);
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: clamp(2rem, 7vw, 3rem);
    }

    .subtitle {
      margin: 0;
      font-size: 1.05rem;
      color: #52606d;
    }

    .section-title {
      margin: 26px 0 10px;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--blue);
    }

    .checklist {
      display: grid;
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 2px 7px rgba(0,0,0,0.04);
    }

    .item:hover { border-color: var(--blue); }

    .item.checked {
      border-color: var(--green);
      background: #eefaf3;
    }

    .item input {
      width: 28px;
      height: 28px;
      margin-top: 2px;
      accent-color: var(--green);
      flex: 0 0 auto;
    }

    .item-text {
      font-size: 1.12rem;
      line-height: 1.4;
      font-weight: 700;
    }

    .details {
      display: block;
      margin-top: 5px;
      font-size: 0.94rem;
      font-weight: 400;
      color: #5b6673;
    }

    .status {
      margin-top: 24px;
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      background: #fff4e8;
      border: 2px solid #ffd5aa;
      color: #8a4b08;
    }

    .status.complete {
      background: #eaf8ef;
      border-color: #a8ddb9;
      color: #146c3b;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px 18px;
      border: none;
      border-radius: 12px;
      background: var(--orange);
      color: white;
      font-size: 1.05rem;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover { filter: brightness(0.95); }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #7b8794;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Forge Closing Check</h1>
      <p class="subtitle">Before leaving the building, confirm every item.</p>
    </header>

    <div class="section-title">People & Safety</div>
    <section class="checklist">
      <label class="item">
        <input type="checkbox" data-key="checkout" />
        <span class="item-text">
          Check out everyone in CheckMeIn
          <span class="details">Make sure all people in the Forge have been checked out.</span>
        </span>
      </label>

      <label class="item">
        <input type="checkbox" data-key="walkways" />
        <span class="item-text">
          Make sure walkways are clear
          <span class="details">Confirm clear paths to both doors from each room.</span>
        </span>
      </label>
    </section>

    <div class="section-title">Turned Off</div>
    <section class="checklist">
      <label class="item">
        <input type="checkbox" data-key="shoptools" />
        <span class="item-text">
          Unplug shop tools and glue guns
        </span>
      </label>

      <label class="item">
        <input type="checkbox" data-key="solderlights" />
        <span class="item-text">
          Turn off solder table lights
        </span>
      </label>

      <label class="item">
        <input type="checkbox" data-key="lights" />
        <span class="item-text">
          Turn off all lights
        </span>
      </label>

      <label class="item">
        <input type="checkbox" data-key="faucets" />
        <span class="item-text">
          Check all faucets are fully off
          <span class="details">Check the bathroom faucets and kitchen faucet.</span>
        </span>
      </label>
    </section>

    <div class="section-title">Turned On</div>
    <section class="checklist">
      <label class="item">
        <input type="checkbox" data-key="dehumidifiers" />
        <span class="item-text">
          Empty all 3 dehumidifiers
          <span class="details">Main room — empty them and turn all 3 back on.</span>
        </span>
      </label>

      <label class="item">
        <input type="checkbox" data-key="airfilters" />
        <span class="item-text">
          Check all 3 shop air filters are on
          <span class="details">Check the 2 air filters plus the big box air filter.</span>
        </span>
      </label>

      <label class="item">
        <input type="checkbox" data-key="shopac" />
        <span class="item-text">
          Check shop air conditioner is on
        </span>
      </label>

      <label class="item">
        <input type="checkbox" data-key="shopfans" />
        <span class="item-text">
          Leave shop ceiling fans on
        </span>
      </label>
    </section>

    <div class="section-title">Cleanup</div>
    <section class="checklist">
      <label class="item">
        <input type="checkbox" data-key="tables" />
        <span class="item-text">
          Make sure tables are mostly cleared
          <span class="details">Leave shared work surfaces reasonably ready for the next group.</span>
        </span>
      </label>
    </section>

    <div class="section-title">Final Exit</div>
    <section class="checklist">
      <label class="item">
        <input type="checkbox" data-key="backdoor" />
        <span class="item-text">
          Check back door is locked
        </span>
      </label>

      <label class="item">
        <input type="checkbox" data-key="frontdoor" />
        <span class="item-text">
          Check front door is locked
        </span>
      </label>
    </section>

    <div class="status" id="status">13 items still need to be checked.</div>

    <button id="resetButton" type="button">Reset for Next Closing</button>

    <div class="footer">The Forge Initiative</div>
  </main>

  <script>
    const checkboxes = [...document.querySelectorAll('input[type="checkbox"]')];
    const status = document.getElementById('status');
    const resetButton = document.getElementById('resetButton');

    function saveState() {
      const state = {};
      checkboxes.forEach(box => {
        state[box.dataset.key] = box.checked;
      });
      localStorage.setItem('forgeClosingChecklist', JSON.stringify(state));
    }

    function loadState() {
      const saved = JSON.parse(localStorage.getItem('forgeClosingChecklist') || '{}');
      checkboxes.forEach(box => {
        box.checked = Boolean(saved[box.dataset.key]);
      });
    }

    function updateDisplay() {
      let checkedCount = 0;

      checkboxes.forEach(box => {
        const item = box.closest('.item');
        item.classList.toggle('checked', box.checked);
        if (box.checked) checkedCount++;
      });

      const remaining = checkboxes.length - checkedCount;

      if (remaining === 0) {
        status.textContent = '✓ Closing check complete — all items are confirmed.';
        status.classList.add('complete');
      } else {
        status.textContent = `${remaining} item${remaining === 1 ? '' : 's'} still need${remaining === 1 ? 's' : ''} to be checked.`;
        status.classList.remove('complete');
      }
    }

    checkboxes.forEach(box => {
      box.addEventListener('change', () => {
        saveState();
        updateDisplay();
      });
    });

    resetButton.addEventListener('click', () => {
      checkboxes.forEach(box => box.checked = false);
      saveState();
      updateDisplay();
    });

    loadState();
    updateDisplay();
  </script>
</body>
</html>
